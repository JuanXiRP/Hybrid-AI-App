[versions]
agp = "8.13.2"
# Format/coverage tooling. These are pinned to EXACT versions on purpose: a minor bump of the
# formatter changes its output, which turns a green `spotlessCheck` red without a source change.
spotless = "7.0.4"
ktlint = "1.6.0"
kover = "0.9.9"
turbine = "1.2.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2024.09.00"
playServicesAuth = "21.5.1"
playServicesPlaces = "17.1.0"
appcompat = "1.7.1"
uiText = "1.11.2"
material3 = "1.4.0"
ui = "1.11.2"
# Play requires Billing Library 8+ for new releases from Aug 31 2026.
#
# The plain `billing` artifact, NOT `billing-ktx`: from 8.1.0 onwards billing-ktx is compiled
# with Kotlin 2.2 metadata and drags in kotlin-stdlib 2.2.10, which the Kotlin 2.0.21 compiler
# pinned by this project cannot read ("binary version of its metadata is 2.2.0, expected 2.0.0").
# We never used the -ktx suspend extensions — BillingManager wraps the callbacks in
# suspendCancellableCoroutine itself — so the Java artifact costs us nothing and avoids a
# Kotlin/KSP/Compose-compiler upgrade that has nothing to do with billing.
billing = "8.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
play-services-places = { group = "com.google.android.gms", name = "play-services-places", version.ref = "playServicesPlaces" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "uiText" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# Deliberately version-less: it resolves through the okhttp-bom 4.12.0 already on the classpath.
# The standalone latest (5.x) belongs to OkHttp 5 and would put two OkHttp majors on the test
# classpath alongside the production 4.12.0 client.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

