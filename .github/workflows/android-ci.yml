name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Force Node.js 24 to prevent GitHub Actions deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate mock local.properties for CI
        run:
            # Generate file with dummy values to satisfy the Manifest Merger
            # The variable name MUST match the one read in build.gradle.kts
            echo "API_TOKEN=DUMMY_MAPS_KEY_FOR_CI" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Each gate is its own step so a failure is attributable. Formatting runs first and is
      # separate from lint, so a stray blank line cannot mask a real static-analysis finding —
      # the same split the backend workflow uses for Prettier vs ESLint.

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Variant-suffixed on purpose: the unsuffixed `koverVerify` spans every build variant and
      # would demand release-variant unit tests too. `koverVerifyDebug` matches the variant the
      # tests above actually ran against.
      - name: Coverage gate
        run: ./gradlew koverVerifyDebug

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/kover/
          if-no-files-found: ignore
